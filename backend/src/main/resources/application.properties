# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fuelup_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=fuelup-super-secret-key-2026-change-this-in-production-please-use-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu-email@gmail.com
spring.mail.password=tu-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=info@fuelup.es

# Stripe
stripe.api.key=sk_test_tu_stripe_secret_key
stripe.webhook.secret=whsec_tu_webhook_secret

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads/

# Cache
spring.cache.type=simple

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Pagination defaults
app.pagination.default-page-size=12
app.pagination.max-page-size=100

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:5500
